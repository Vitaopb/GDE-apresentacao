<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 472 300" role="img" aria-label="FPS — Faculdade Pernambucana de Saúde">
  <!-- símbolo -->
  <g>
    <!-- barra verde superior -->
    <rect x="16" y="8" width="150" height="20" rx="8" fill="#3f9c35"/>
    <!-- barra lima logo abaixo -->
    <rect x="16" y="36" width="150" height="16" rx="8" fill="#a6ce39"/>
    <!-- escudo em "U" (lima) -->
    <path d="M24 60 V120 a67 67 0 0 0 67 67 a67 67 0 0 0 67 -67 V60"
          fill="none" stroke="#a6ce39" stroke-width="28" stroke-linecap="round"/>
    <!-- cruz médica (verde) -->
    <g fill="#5aa832">
      <rect x="78" y="64" width="26" height="98" rx="5"/>
      <rect x="44" y="98" width="94" height="26" rx="5"/>
    </g>
  </g>
  <!-- marca "FPS" -->
  <text x="196" y="132" font-family="Arial, Helvetica, sans-serif" font-size="98" font-weight="800"
        letter-spacing="3" fill="#3f9c35">FPS</text>
  <!-- assinatura -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"
     letter-spacing="1.5" fill="#5b6770">
    <text x="198" y="176">FACULDADE</text>
    <text x="198" y="208">PERNAMBUCANA</text>
    <text x="198" y="240">DE SAÚDE</text>
  </g>
</svg>
